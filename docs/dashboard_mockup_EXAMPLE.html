<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>EXAMPLE ONLY - Pizza Kitchen Dashboard Mockup (not the real project)</title>
<style>
  /* Basic layout only - not final visual polish, just enough to see the structure */
  body {
    font-family: sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 24px;
  }

  h1 {
    text-align: center;
  }

  /* Two cards side by side - this is the pattern for your left/right cards */
  .card-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap; /* so it doesn't break on narrow screens */
  }

  .card {
    background: white;
    border-radius: 8px;
    padding: 16px;
    flex: 1;
    min-width: 260px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }

  label {
    display: block;
    margin-top: 8px;
  }

  input {
    padding: 6px;
    width: 100%;
    box-sizing: border-box;
  }

  button {
    margin-top: 12px;
    padding: 8px 16px;
  }

  .countdown {
    font-size: 48px;
    text-align: center;
    font-weight: bold;
  }

  /* the 6-digit style code entry, adapted here to a 4-digit oven code */
  .code-entry {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .code-entry input {
    width: 40px;
    text-align: center;
  }

  /* Live status grid - this is the pattern for your "Live-Status aller Stationen" section */
  .status-grid {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .oven {
    padding: 12px;
    border-radius: 6px;
    color: white;
    min-width: 100px;
    text-align: center;
  }

  /* colors just show the pattern - map to your own state/rating values */
  .oven.idle { background: gray; }
  .oven.active { background: goldenrod; }
  .oven.done { background: seagreen; }
</style>
</head>
<body>

<h1>Pizza Kitchen Dashboard (EXAMPLE - not the real project)</h1>

<div class="card-row">

  <!-- LEFT CARD: inputs + start button, same pattern as your team-name/participant-count/start -->
  <div class="card">
    <h2>New Order</h2>

    <label for="customer-name">Customer Name</label>
    <!-- data-field annotates which data model field this input maps to -->
    <input id="customer-name" type="text" data-field="customer_name" placeholder="e.g. Alex">

    <label for="pizza-count">Number of Pizzas</label>
    <input id="pizza-count" type="number" data-field="pizza_count" value="1" min="1">

    <button id="start-btn" data-action="start_order">Start Order</button>
  </div>

  <!-- RIGHT CARD: countdown + code entry, same pattern as your countdown/6-digit code -->
  <div class="card">
    <h2>Prep Timer</h2>

    <div class="countdown" data-field="countdown_remaining">12:00</div>

    <p style="text-align:center;">Enter pickup confirmation code:</p>
    <div class="code-entry">
      <input maxlength="1" data-field="confirmation_code[0]">
      <input maxlength="1" data-field="confirmation_code[1]">
      <input maxlength="1" data-field="confirmation_code[2]">
      <input maxlength="1" data-field="confirmation_code[3]">
    </div>
    <div style="text-align:center;">
      <button id="confirm-btn" data-action="confirm_code">Confirm</button>
    </div>
  </div>

</div>

<!-- LIVE STATUS: same pattern as your per-station state/rating display -->
<h2>Oven Status (live)</h2>
<div class="status-grid">
  <div class="oven idle" data-field="oven_1.state">Oven 1: idle</div>
  <div class="oven active" data-field="oven_2.state">Oven 2: active</div>
  <div class="oven done" data-field="oven_3.state">Oven 3: done</div>
</div>

<script>
  // Just enough JS to show the pattern - hardcoded example data, no backend.
  // In your real mockup you'd fake the data you already defined in the ICD/data table.

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = document.getElementById('customer-name').value;
    console.log('Order started for:', name);
    // real dashboard would send this via the backend -> MQTT here
  });

  document.getElementById('confirm-btn').addEventListener('click', () => {
    const inputs = document.querySelectorAll('.code-entry input');
    const code = Array.from(inputs).map(i => i.value).join('');
    console.log('Code entered:', code);
  });
</script>

</body>
</html>
