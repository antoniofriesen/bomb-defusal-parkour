name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dashboard-backend
          - dashboard-frontend
          - scoreboard-backend
          - scoreboard-frontend
      push_images:
        description: 'Push images to Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dashboard-backend: ${{ steps.filter.outputs.dashboard-backend }}
      dashboard-frontend: ${{ steps.filter.outputs.dashboard-frontend }}
      scoreboard-backend: ${{ steps.filter.outputs.scoreboard-backend }}
      scoreboard-frontend: ${{ steps.filter.outputs.scoreboard-frontend }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - '.github/workflows/docker-build.yml'
              - 'docker-compose.yml'
            dashboard-backend:
              - 'dashboard/backend/**'
            dashboard-frontend:
              - 'dashboard/frontend/**'
            scoreboard-backend:
              - 'scoreboard/backend/**'
            scoreboard-frontend:
              - 'scoreboard/frontend/**'

  build-dashboard-backend:
    name: Build & Push Dashboard Backend
    needs: [detect-changes]
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'dashboard-backend')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs.dashboard-backend == 'true' || needs.detect-changes.outputs.all == 'true' || github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bomb-defusal-dashboard-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard/backend
          file: ./dashboard/backend/Dockerfile
          push: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard-backend
          cache-to: type=gha,mode=max,scope=dashboard-backend

  build-dashboard-frontend:
    name: Build & Push Dashboard Frontend
    needs: [detect-changes]
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'dashboard-frontend')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs.dashboard-frontend == 'true' || needs.detect-changes.outputs.all == 'true' || github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bomb-defusal-dashboard-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard/frontend
          file: ./dashboard/frontend/Dockerfile
          push: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard-frontend
          cache-to: type=gha,mode=max,scope=dashboard-frontend

  build-scoreboard-backend:
    name: Build & Push Scoreboard Backend
    needs: [detect-changes]
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'scoreboard-backend')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs.scoreboard-backend == 'true' || needs.detect-changes.outputs.all == 'true' || github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bomb-defusal-scoreboard-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./scoreboard/backend
          file: ./scoreboard/backend/Dockerfile
          push: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scoreboard-backend
          cache-to: type=gha,mode=max,scope=scoreboard-backend

  build-scoreboard-frontend:
    name: Build & Push Scoreboard Frontend
    needs: [detect-changes]
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'scoreboard-frontend')) ||
      (github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs.scoreboard-frontend == 'true' || needs.detect-changes.outputs.all == 'true' || github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bomb-defusal-scoreboard-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./scoreboard/frontend
          file: ./scoreboard/frontend/Dockerfile
          push: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scoreboard-frontend
          cache-to: type=gha,mode=max,scope=scoreboard-frontend
