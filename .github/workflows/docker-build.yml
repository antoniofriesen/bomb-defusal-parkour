name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dashboard-backend
          - dashboard-frontend
          - scoreboard-backend
          - scoreboard-frontend
          - module-test
      push_images:
        description: 'Push images to Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r scoreboard/backend/requirements.txt -r scoreboard/backend/requirements-dev.txt

      - name: Run root tests (ICD Interface)
        run: pytest tests

      - name: Run Scoreboard Backend tests
        run: |
          cd scoreboard/backend
          pytest

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dashboard-backend: ${{ steps.filter.outputs.dashboard-backend }}
      dashboard-frontend: ${{ steps.filter.outputs.dashboard-frontend }}
      scoreboard-backend: ${{ steps.filter.outputs.scoreboard-backend }}
      scoreboard-frontend: ${{ steps.filter.outputs.scoreboard-frontend }}
      module-test: ${{ steps.filter.outputs.module-test }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - '.github/workflows/docker-build.yml'
              - 'docker-compose.yml'
            dashboard-backend:
              - 'dashboard/backend/**'
            dashboard-frontend:
              - 'dashboard/frontend/**'
            scoreboard-backend:
              - 'scoreboard/backend/**'
            scoreboard-frontend:
              - 'scoreboard/frontend/**'
            module-test:
              - 'module_test/**'

  build-and-push:
    name: Build & Push (${{ matrix.name }})
    needs: [test, detect-changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: dashboard-backend
            name: Dashboard Backend
            context: ./dashboard/backend
            file: ./dashboard/backend/Dockerfile
            image_suffix: bomb-defusal-dashboard-backend
          - id: dashboard-frontend
            name: Dashboard Frontend
            context: ./dashboard/frontend
            file: ./dashboard/frontend/Dockerfile
            image_suffix: bomb-defusal-dashboard-frontend
          - id: scoreboard-backend
            name: Scoreboard Backend
            context: ./scoreboard/backend
            file: ./scoreboard/backend/Dockerfile
            image_suffix: bomb-defusal-scoreboard-backend
          - id: scoreboard-frontend
            name: Scoreboard Frontend
            context: ./scoreboard/frontend
            file: ./scoreboard/frontend/Dockerfile
            image_suffix: bomb-defusal-scoreboard-frontend
          - id: module-test
            name: Module Test Tool
            context: ./module_test
            file: ./module_test/Dockerfile
            image_suffix: bomb-defusal-module-test
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == matrix.id)) ||
        (github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs[matrix.id] == 'true' || needs.detect-changes.outputs.all == 'true' || github.ref_type == 'tag'))
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}
